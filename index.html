<style>
/* Layout: the quitecordial.com look in a reading room. Teal masthead with the real logo, cream pages, plum links, a teal sign-up card with the gold button. */
:root {
  --bg: #f1f1e9;
  --ink: #1d2a28;
  --muted: #55625e;
  --accent: #4f2641;
  --band: #0b3633;
  --band-ink: #ffffff;
  --gold: #d1b838;
  --gold-ink: #191919;
  --rule: #d6d5c8;
  --notice: #4f2641;
  --notice-ink: #ffffff;
  --notice-link: #ebcc2d;
  --display: "Abril Fatface", "Didot", Georgia, serif;
  --body: "Crimson Text", Georgia, "Times New Roman", serif;
  --label: "Josefin Sans", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b2927; --ink: #f1f1e9; --muted: #aebab5; --accent: #ebcc2d; --band: #0b3633; --band-ink: #ffffff;
    --rule: #25443f; --notice: #4f2641; --notice-ink: #ffffff; --notice-link: #ebcc2d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b2927; --ink: #f1f1e9; --muted: #aebab5; --accent: #ebcc2d; --band: #0b3633; --band-ink: #ffffff;
  --rule: #25443f; --notice: #4f2641; --notice-ink: #ffffff; --notice-link: #ebcc2d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.25rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.in {
  max-width: 48rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Notice: shown on every view */
.notice { background: var(--notice); color: var(--notice-ink); font-family: var(--label); font-size: 0.8rem; line-height: 1.5; letter-spacing: 0.04em; }
.notice .in { padding-block: 0.6rem; }
.notice a { color: var(--notice-link); font-weight: 600; text-underline-offset: 3px; }

/* Masthead */
.band { background: var(--band); color: var(--band-ink); border-bottom: 1px solid rgba(255,255,255,0.18); }
.band .in { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 0.9rem; }
.logo { display: block; background: #fff; border-radius: 4px; padding: 2px; line-height: 0; }
.logo img { display: block; height: 3.1rem; width: auto; }
.cta {
  font-family: var(--label); font-weight: 600; font-size: 0.74rem; letter-spacing: 0.2em; text-transform: uppercase;
  text-decoration: none; color: var(--gold); border: 1px solid var(--gold); border-radius: 3px; padding: 0.6rem 0.95rem; white-space: nowrap;
}
.cta:hover { background: var(--gold); color: var(--gold-ink); }
.btn {
  display: inline-block; background: var(--gold); color: var(--gold-ink); text-decoration: none;
  font-family: var(--label); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.22em; text-transform: uppercase;
  padding: 1rem 1.6rem; border-radius: 2px;
}
.btn:hover { background: #ebcc2d; }

main { padding-block: 0 2.5rem; }

/* Index */
.intro { padding-block: 2.6rem 1.6rem; }
.eyebrow { font-family: var(--label); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0 0 0.6rem; }
.intro h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.3rem, 7vw, 3.6rem); line-height: 1.08; margin: 0; text-wrap: balance; }
.intro p { margin: 1rem 0 0; max-width: 38rem; color: var(--muted); }
.thead, .row { display: grid; grid-template-columns: 3rem minmax(0, 1fr) 8rem; column-gap: 1rem; align-items: baseline; }
.thead { padding-block: 0.6rem; border-bottom: 2px solid var(--ink); font-family: var(--label); font-weight: 600; font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.row { padding-block: 1.3rem; border-bottom: 1px solid var(--rule); text-decoration: none; }
.row:hover .name { color: var(--accent); }
.row .no { font-family: var(--label); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .tag { display: block; font-family: var(--label); font-weight: 600; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.25rem; }
.row .name { display: block; font-family: var(--display); font-size: 1.7rem; line-height: 1.15; text-wrap: balance; }
.row .pre { display: block; margin-top: 0.35rem; color: var(--muted); font-size: 1.05rem; line-height: 1.45; }
.row .when { font-family: var(--label); font-size: 0.82rem; line-height: 1.6; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .when span { display: block; }
.note { margin: 1.4rem 0 0; font-family: var(--label); font-size: 0.8rem; letter-spacing: 0.04em; color: var(--muted); }

/* Empty state and sign-up card share the site's teal and gold */
.card { background: var(--band); color: var(--band-ink); padding: 1.8rem 1.6rem 2rem; margin-top: 0.6rem; }
.card .eyebrow { color: var(--gold); }
.card h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.12; margin: 0; text-wrap: balance; }
.card p { margin: 0.8rem 0 0; max-width: 34rem; color: #e4ebe8; }
.card .btn { margin-top: 1.4rem; }

/* Letter */
.back { display: inline-block; margin-block: 1.4rem 0; font-family: var(--label); font-weight: 600; font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; color: var(--muted); }
.back:hover { color: var(--accent); }
.head { padding-block: 1.2rem 0; }
.head h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.8rem); line-height: 1.08; margin: 0; text-wrap: balance; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 1rem 1.5rem; margin: 1.8rem 0 0; padding-block: 1rem; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
.strip div { min-width: 0; }
.strip dt { font-family: var(--label); font-weight: 600; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.strip dd { margin: 0.2rem 0 0; font-size: 1.1rem; line-height: 1.35; font-variant-numeric: tabular-nums; }
.prose { max-width: 38rem; padding-block: 2rem 1rem; font-size: 1.3rem; line-height: 1.65; }
.prose > * { margin: 0; }
.prose > * + * { margin-top: 1.1em; }
.prose a { color: var(--accent); text-underline-offset: 3px; }
.prose h2, .prose h3 { font-family: var(--display); font-weight: 400; line-height: 1.2; text-wrap: balance; }
.prose h2 { font-size: 1.75rem; margin-top: 1.6em; }
.prose h3 { font-size: 1.4rem; margin-top: 1.4em; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: 0.4em; }
.prose blockquote { padding-left: 1em; border-left: 3px solid var(--rule); color: var(--muted); }
.prose img { display: block; max-width: 100%; height: auto; margin-block: 1.4em; border-radius: 2px; }
.prose .dateline { font-style: italic; color: var(--muted); }
.prose .ask { padding-top: 1.1em; border-top: 1px solid var(--rule); }
.prose .ask strong { display: block; margin-bottom: 0.3em; font-family: var(--label); font-weight: 700; font-size: 0.74rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
.prose .signoff { margin-top: 1.5em; }
.prose .name { font-family: var(--display); font-size: 1.6rem; }
.prose .signoff + .name { margin-top: 0.3em; }
.prose .ledger { font-size: 1.05rem; line-height: 1.6; color: var(--muted); padding-top: 1.1em; border-top: 2px solid var(--ink); }
.prose .ledger strong { display: block; margin-bottom: 0.2em; font-family: var(--label); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); }

.next { display: flex; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; padding-block: 1.4rem; border-top: 1px solid var(--rule); }
.next a { text-decoration: none; min-width: 0; max-width: 100%; }
.next small { display: block; font-family: var(--label); font-weight: 600; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.next span { font-family: var(--display); font-size: 1.35rem; }
.next a:hover span { color: var(--accent); }

footer { border-top: 1px solid var(--rule); }
footer .in { padding-block: 1.4rem 2.4rem; font-size: 0.95rem; color: var(--muted); }

@media (max-width: 560px) {
  .thead { display: none; }
  .row { grid-template-columns: 2.2rem minmax(0, 1fr); row-gap: 0.6rem; }
  .row .when { grid-column: 2; display: flex; gap: 0.9rem; }
  .row .name { font-size: 1.5rem; }
  .logo img { height: 2.5rem; }
  .cta { padding: 0.55rem 0.7rem; font-size: 0.68rem; letter-spacing: 0.14em; }
  .prose { font-size: 1.2rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .row .name, .back, .next span, .cta, .btn { transition: color 0.15s ease, background-color 0.15s ease; }
}
</style>

<!--
HOW TO ADD A LETTER (for the weekly archive task). Do all three, then republish this same file.
1. LETTERS array in the script below: insert one entry immediately above the LETTERS-END comment that closes the array, oldest first, each followed by a comma:
   {id:"letter-N", no:N, title:"<subject line exactly as sent>", preview:"<preheader teaser>", filed:"YYYY·MM·DD", length:"N min"},
   N is one more than the highest existing no. Escape quotes and backslashes in strings.
2. Insert a template element immediately above the TEMPLATES-END comment (the last HTML comment before the script), with id "tpl-" plus the entry id, holding the letter body as clean HTML.
   Allowed tags only: p, h2, h3, ul, ol, li, em, strong, a, img, br, blockquote, hr. No script, style, iframe, or on* attributes.
   Keep the classes dateline, ask, signoff, name, ledger on the matching p elements, as in earlier letters. The ask paragraph starts with a strong lead-in (for example One small favor, no colon) and the ledger paragraph starts with a strong The Ledger.
3. Images are published as files next to this page at letters/letter-N/img-K.ext and referenced with a relative src, for example img src="letters/letter-N/img-1.jpg". External image hosts are blocked in the viewer.
Never write a double hyphen followed by a greater-than sign inside this comment.
-->
<!-- TEMPLATES-END -->

<script>
(function () {
  "use strict";
  var SIGNUP = "https://quitecordial.com/#waitlist";
  // Oldest first. Add each letter after it has been sent, with a matching template id "tpl-" + id.
  var LETTERS = [
    /* LETTERS-END */
  ];

  var app = document.getElementById("app");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function find(id) {
    for (var i = 0; i < LETTERS.length; i++) if (LETTERS[i].id === id) return i;
    return -1;
  }
  function joinCard(eyebrow, heading, text) {
    return '<section class="card"><p class="eyebrow">' + esc(eyebrow) + '</p><h2>' + esc(heading) + '</h2><p>' + esc(text) + '</p>' +
      '<a class="btn" href="' + SIGNUP + '" target="_blank" rel="noopener">Join the wait list</a></section>';
  }

  function renderIndex() {
    var intro = '<section class="intro"><p class="eyebrow">Letters from Belinda</p><h1>Letters from the house journey</h1>' +
      '<p>Notes on finding, restoring and furnishing a getaway house for readers and writers.</p></section>';
    if (!LETTERS.length) {
      app.innerHTML = intro + joinCard("Coming soon", "The first letter hasn’t gone out yet.",
        "Letters arrive by email every other Tuesday, and each one is saved here afterward. Join the wait list to get the first.");
      return;
    }
    var rows = "";
    for (var i = LETTERS.length - 1; i >= 0; i--) {
      var L = LETTERS[i];
      rows += '<a class="row" href="#' + esc(L.id) + '">' +
        '<span class="no">' + pad(L.no) + '</span>' +
        '<span class="ttl">' + (i === LETTERS.length - 1 ? '<span class="tag">Latest letter</span>' : "") +
        '<span class="name">' + esc(L.title) + '</span>' +
        '<span class="pre">' + esc(L.preview) + '</span></span>' +
        '<span class="when"><span>' + esc(L.filed) + '</span><span>' + esc(L.length) + '</span></span></a>';
    }
    var count = LETTERS.length + (LETTERS.length === 1 ? " letter" : " letters") + " so far";
    app.innerHTML = intro.replace("restoring and furnishing a getaway house for readers and writers.", "restoring and furnishing a getaway house for readers and writers. " + esc(count) + ".") +
      '<div class="thead"><span>No.</span><span>Letter</span><span>Filed · Length</span></div>' + rows +
      '<p class="note">A new letter arrives every other Tuesday.</p>';
  }

  function renderLetter(idx) {
    var L = LETTERS[idx];
    var tpl = document.getElementById("tpl-" + L.id);
    var body = tpl ? tpl.innerHTML : "<p>This letter is not available yet.</p>";
    var older = idx > 0 ? LETTERS[idx - 1] : null;
    var newer = idx < LETTERS.length - 1 ? LETTERS[idx + 1] : null;
    var nav = "";
    if (older) nav += '<a href="#' + esc(older.id) + '"><small>← Older</small><span>' + esc(older.title) + '</span></a>';
    if (newer) nav += '<a href="#' + esc(newer.id) + '" style="margin-left:auto;text-align:right"><small>Newer →</small><span>' + esc(newer.title) + '</span></a>';
    app.innerHTML =
      '<a class="back" href="#all">← All letters</a>' +
      '<div class="head"><h1>' + esc(L.title) + '</h1>' +
      '<dl class="strip"><div><dt>Letter</dt><dd>No. ' + pad(L.no) + '</dd></div>' +
      '<div><dt>Filed</dt><dd>' + esc(L.filed) + '</dd></div>' +
      '<div><dt>Length</dt><dd>' + esc(L.length) + '</dd></div></dl></div>' +
      '<article class="prose">' + body + '</article>' +
      (nav ? '<nav class="next" aria-label="More letters">' + nav + '</nav>' : "") +
      joinCard("Forwarded this one?", "Welcome. Pull up a chair.", "New letters go to the wait list first, every other Tuesday. Join to get the next one in your inbox.");
  }

  function route() {
    var id = "";
    try { id = (location.hash || "").replace(/^#/, ""); } catch (e) { id = ""; }
    var idx = find(id);
    if (idx >= 0) renderLetter(idx); else renderIndex();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
